<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家族のクルマ予約</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* スマホでタッチしやすいように最小の高さを調整 */
        .calendar-cell {
            min-height: 90px;
        }
        @media (min-width: 640px) {
            .calendar-cell {
                min-height: 110px;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- ヘッダー（スマホで文字がはみ出さないよう調整） -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold flex items-center gap-2">
                🚗 家族のクルマ予約
            </h1>
            <nav class="flex gap-1.5 sm:gap-2">
                <button onclick="switchTab('calendar')" id="btn-calendar" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-700 shadow-inner">
                    カレンダー
                </button>
                <button onclick="switchTab('register')" id="btn-register" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-500 hover:bg-indigo-600">
                    新規予約
                </button>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-8 flex-1 w-full relative">

        <!-- ローディング表示 -->
        <div id="loading" class="hidden absolute inset-0 bg-white/70 z-40 flex justify-center items-center">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
        </div>

        <!-- モーダル通知用 -->
        <div id="toast" class="fixed bottom-5 right-5 left-5 sm:left-auto bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 font-medium text-center sm:text-left">
            予約が完了しました！
        </div>

        <!-- 1. 閲覧画面（カレンダー形式） -->
        <section id="view-calendar" class="space-y-4 sm:space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                <!-- カレンダーコントロール -->
                <div class="flex justify-between items-center mb-4 sm:mb-6">
                    <h2 id="calendar-title" class="text-lg sm:text-xl font-bold text-slate-700"></h2>
                    <div class="flex gap-1.5 sm:gap-2">
                        <button onclick="changeMonth(-1)" class="px-3 py-1.5 text-xs sm:text-sm border rounded-lg hover:bg-slate-100 transition">◀ 前月</button>
                        <button onclick="changeMonth(1)" class="px-3 py-1.5 text-xs sm:text-sm border rounded-lg hover:bg-slate-100 transition">次月 ▶</button>
                    </div>
                </div>

                <!-- 曜日ヘッダー -->
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs sm:text-sm text-slate-500 mb-2">
                    <div class="text-red-500">日</div>
                    <div>月</div>
                    <div>火</div>
                    <div>水</div>
                    <div>木</div>
                    <div>金</div>
                    <div class="text-blue-500">土</div>
                </div>

                <!-- カレンダー本体グリッド -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                    <!-- JSで動的生成 -->
                </div>
            </div>

            <!-- 登録されている予約一覧 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base sm:text-lg font-bold text-slate-700">📅 登録されている予約一覧</h3>
                    <button onclick="fetchReservations()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-600 transition">🔄 更新</button>
                </div>
                <div id="reservation-list" class="space-y-2 sm:space-y-3">
                    <!-- JSで動的生成 -->
                </div>
            </div>
        </section>

        <!-- 2. 登録画面 -->
        <section id="view-register" class="hidden max-w-lg mx-auto">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
                <h2 class="text-lg sm:text-xl font-bold text-slate-700 mb-6 text-center">🚗 クルマを使う日時を登録する</h2>
                <form id="reservation-form" onsubmit="handleRegister(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">名前（利用者）</label>
                        <input type="text" id="user-name" required placeholder="例：お父さん、太郎" class="w-full border border-slate-300 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">利用日程</label>
                        <input type="date" id="reservation-date" required class="w-full border border-slate-300 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-1.5">開始時間（任意）</label>
                            <input type="time" id="start-time" class="w-full border border-slate-300 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-1.5">終了時間（任意）</label>
                            <input type="time" id="end-time" class="w-full border border-slate-300 rounded-xl p-3 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md text-base mt-2">
                        予約を登録する
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="text-center py-6 text-xs text-slate-400">
        &copy; 家族のカーシェア管理システム
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        // ★ご自身のウェブアプリのURLに書き換えてください
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMPCdO4toiayPZiP9MhoCsmBL_kxOwTZEhFA7fPBPjUpSk2U_XCGz6fE5baJSiKkYC/exec';

        let reservations = [];
        let currentDate = new Date();

        window.onload = function() {
            fetchReservations();
        };

        function fetchReservations() {
            showLoading(true);
            fetch(`${SCRIPT_URL}?action=get`)
                .then(response => response.json())
                .then(data => {
                    reservations = data;
                    renderCalendar();
                    showLoading(false);
                })
                .catch(error => {
                    console.error('データ取得エラー:', error);
                    alert('データの取得に失敗しました。');
                    showLoading(false);
                });
        }

        function switchTab(tab) {
            const calendarSection = document.getElementById('view-calendar');
            const registerSection = document.getElementById('view-register');
            const btnCalendar = document.getElementById('btn-calendar');
            const btnRegister = document.getElementById('btn-register');

            if (tab === 'calendar') {
                calendarSection.classList.remove('hidden');
                registerSection.classList.add('hidden');
                btnCalendar.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-700 shadow-inner";
                btnRegister.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-500 hover:bg-indigo-600";
                fetchReservations();
            } else {
                calendarSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
                btnRegister.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-700 shadow-inner";
                btnCalendar.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-medium transition bg-indigo-500 hover:bg-indigo-600";
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendar-title').innerText = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "calendar-cell bg-slate-50/50 rounded-xl border border-slate-100";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= lastDay; day++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cell = document.createElement('div');
                cell.className = "calendar-cell border border-slate-200 rounded-xl p-1 flex flex-col justify-between bg-white overflow-hidden";

                const dayHeader = document.createElement('div');
                dayHeader.className = "text-[11px] sm:text-xs font-semibold text-slate-500";
                dayHeader.innerText = day;
                cell.appendChild(dayHeader);

                const matchRes = reservations.filter(r => {
                    if (!r.date) return false;
                    const cleanDate = String(r.date).split('T')[0].replaceAll('/', '-');
                    return cleanDate === dateString;
                });

                const contentDiv = document.createElement('div');
                contentDiv.className = "flex-1 overflow-y-auto space-y-0.5 mt-0.5";

                matchRes.forEach(res => {
                    const badge = document.createElement('div');
                    badge.className = "text-[10px] sm:text-xs px-1 py-0.5 rounded border font-medium bg-indigo-50 text-indigo-700 border-indigo-200 truncate";
                    
                    let timeText = '';
                    if (res.startTime) {
                        timeText = ` (${res.startTime})`;
                    }
                    badge.innerText = `🚗${res.name}${timeText}`;
                    badge.title = `${res.name}が利用${timeText}`;
                    
                    contentDiv.appendChild(badge);
                });

                cell.appendChild(contentDiv);
                grid.appendChild(cell);
            }

            renderReservationList();
        }

        function renderReservationList() {
            const listContainer = document.getElementById('reservation-list');
            listContainer.innerHTML = '';

            const sorted = [...reservations].sort((a, b) => new Date(a.date) - new Date(b.date));

            if (sorted.length === 0) {
                listContainer.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">現在登録されている予約はありません。</p>`;
                return;
            }

            sorted.forEach(res => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-2.5 sm:p-3 bg-slate-50 border border-slate-200 rounded-xl gap-2";
                
                let timeText = '';
                if (res.startTime) {
                    timeText = ` / ${res.startTime} 〜 ${res.endTime || ''}`;
                }

                item.innerHTML = `
                    <div class="flex items-center gap-2 sm:gap-3 overflow-hidden">
                        <span class="px-2 py-1 rounded-lg text-xs font-bold bg-indigo-100 text-indigo-700 shrink-0">${res.name}</span>
                        <span class="text-xs sm:text-sm font-medium text-slate-700 truncate">${res.date} ${timeText}</span>
                    </div>
                    <button onclick="deleteReservation('${res.id}')" class="text-xs text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded shrink-0 transition">削除</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const date = document.getElementById('reservation-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (!name || !date) return;

            const newReservation = {
                id: 'res_' + Date.now(),
                name: name,
                date: date,
                startTime: startTime,
                endTime: endTime
            };

            showLoading(true);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'add', ...newReservation })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    document.getElementById('reservation-form').reset();
                    showToast("予約を登録しました！");
                    fetchReservations();
                    switchTab('calendar');
                } else {
                    alert('登録に失敗しました。');
                    showLoading(false);
                }
            })
            .catch(error => {
                console.error('通信エラー:', error);
                alert('通信エラーが発生しました。');
                showLoading(false);
            });
        }

        function deleteReservation(id) {
            if (confirm("この予約を削除してもよろしいですか？")) {
                showLoading(true);
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id: id })
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        showToast("予約を削除しました。");
                        fetchReservations();
                    } else {
                        alert('削除に失敗しました。');
                        showLoading(false);
                    }
                })
                .catch(error => {
                    console.error('通信エラー:', error);
                    alert('通信エラーが発生しました。');
                    showLoading(false);
                });
            }
        }

        function showLoading(isLoading) {
            const loader = document.getElementById('loading');
            if (isLoading) {
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
